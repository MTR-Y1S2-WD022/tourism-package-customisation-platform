<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Form - Ceylon Dream Travels</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --ceylon-green: #102A23;
            --ceylon-gold: #F4A261;
            --ceylon-bg: #FDFBF7;
        }

        body {
            background: var(--ceylon-bg);
        }

        .form-card {
            border: none;
            border-radius: 18px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        .form-header {
            background: linear-gradient(135deg, var(--ceylon-green), #1B4332);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .form-body {
            padding: 30px;
        }

        .btn-ceylon {
            background: linear-gradient(135deg, var(--ceylon-gold), #e76f51);
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 999px;
            padding: 10px 20px;
            transition: 0.3s;
        }

        .btn-ceylon:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 15px rgba(244,162,97,0.6);
        }

        .btn-cancel {
            border-radius: 999px;
        }

        .form-control:focus {
            border-color: var(--ceylon-gold);
            box-shadow: 0 0 0 0.2rem rgba(244,162,97,0.25);
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark" style="background: var(--ceylon-green);">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/admin/dashboard}">
            Ceylon Dream Travels Admin
        </a>

        <div class="d-flex gap-2">
            <a class="btn btn-outline-light btn-sm" th:href="@{/admin/list}">
                Admin List
            </a>
            <a class="btn btn-outline-light btn-sm" th:href="@{/admin/logout}">
                Logout
            </a>
        </div>
    </div>
</nav>

<div class="container mt-5">

    <div class="row justify-content-center">
        <div class="col-md-7">

            <div class="card form-card">

                <!-- HEADER -->
                <div class="form-header">
                    <h4 class="mb-0" th:text="${formTitle}">Admin Form</h4>
                </div>

                <!-- BODY -->
                <div class="form-body">

                    <div th:if="${errorMessage}" class="alert alert-danger">
                        <span th:text="${errorMessage}"></span>
                    </div>

                    <form th:action="@{${formAction}}" th:object="${admin}" method="post">

                        <input type="hidden" th:field="*{adminId}">
                        <input type="hidden" th:field="*{role}">
                        <input type="hidden" th:field="*{default}">

                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" class="form-control"
                                   th:field="*{fullName}"
                                   placeholder="Enter full name"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <input type="email" class="form-control"
                                   th:field="*{email}"
                                   placeholder="Enter email"
                                   required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control"
                                   th:field="*{password}"
                                   placeholder="Enter password"
                                   required>
                        </div>

                        <div class="d-flex justify-content-between">

                            <a th:href="@{/admin/list}"
                               class="btn btn-secondary btn-cancel">
                                Cancel
                            </a>

                            <button type="submit" class="btn btn-ceylon">
                                Save Admin
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>
    </div>

</div>

</body>
</html>

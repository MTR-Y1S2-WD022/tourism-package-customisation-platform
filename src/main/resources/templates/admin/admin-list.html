<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin List - Tourism Platform</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" th:href="@{/admin/dashboard}">Tourism Admin Panel</a>

        <div class="d-flex gap-2">
            <a class="btn btn-outline-light btn-sm" th:href="@{/admin/dashboard}">Dashboard</a>
            <a class="btn btn-outline-light btn-sm" th:href="@{/admin/logout}">Logout</a>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Admin List</h3>

        <a th:href="@{/admin/new}" class="btn btn-primary">
            Add New Admin
        </a>
    </div>

    <div th:if="${message}" class="alert alert-info">
        <span th:text="${message}"></span>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">

            <div class="table-responsive">
                <table class="table table-bordered table-striped align-middle">
                    <thead class="table-primary">
                    <tr>
                        <th>ID</th>
                        <th>Full Name</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Default Admin</th>
                        <th>Created At</th>
                        <th style="width: 180px;">Actions</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="admin : ${admins}">
                        <td th:text="${admin.adminId}">1</td>
                        <td th:text="${admin.fullName}">Default Admin</td>
                        <td th:text="${admin.email}">admin@gmail.com</td>
                        <td th:text="${admin.role}">ADMIN</td>
                        <td>
                            <span th:if="${admin.status == 'ACTIVE'}" class="badge bg-success">ACTIVE</span>
                            <span th:if="${admin.status == 'INACTIVE'}" class="badge bg-secondary">INACTIVE</span>
                        </td>
                        <td>
                            <span th:if="${admin.default}" class="badge bg-warning text-dark">YES</span>
                            <span th:if="${!admin.default}" class="badge bg-light text-dark">NO</span>
                        </td>
                        <td th:text="${admin.createdAt}">2026-01-01</td>
                        <td>
                            <a th:href="@{/admin/edit/{adminId}(adminId=${admin.adminId})}"
                               class="btn btn-sm btn-warning">
                                Edit
                            </a>

                            <a th:if="${!admin.default and admin.adminId != loggedInAdminId}"
                               th:href="@{/admin/delete/{adminId}(adminId=${admin.adminId})}"
                               class="btn btn-sm btn-danger"
                               onclick="return confirm('Are you sure you want to deactivate this admin?');">
                                Deactivate
                            </a>

                            <span th:if="${admin.default}" class="text-muted small d-block mt-1">
                                Protected
                            </span>

                            <span th:if="${admin.adminId == loggedInAdminId}" class="text-muted small d-block mt-1">
                                Current login
                            </span>
                        </td>
                    </tr>

                    <tr th:if="${admins == null or admins.isEmpty()}">
                        <td colspan="8" class="text-center text-muted">
                            No admins found.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        :root {
            --ceylon-green: #102A23;
            --ceylon-gold: #F4A261;
            --ceylon-bg: #FDFBF7;
        }

        body {
            background-color: var(--ceylon-bg);
        }

        .header {
            background: var(--ceylon-green);
            color: white;
            padding: 20px;
            border-radius: 15px;
        }

        .table-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        .badge-super {
            background: linear-gradient(135deg, #ff0033, #8b0000);
            color: white;
            padding: 6px 14px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 12px;
            letter-spacing: 1px;
            box-shadow: 0 0 12px rgba(255, 0, 60, 0.6);
            text-transform: uppercase;
        }
        .badge-super {
            background: linear-gradient(135deg, #ff0033, #8b0000);
            color: white;
            padding: 6px 14px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 12px;
            letter-spacing: 1px;
            box-shadow: 0 0 12px rgba(255, 0, 60, 0.6);
            text-transform: uppercase;
        }

        .badge-admin {
            background: linear-gradient(135deg, #007bff, #001f4d);
            color: white;
            padding: 6px 14px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 12px;
            letter-spacing: 1px;
            box-shadow: 0 0 12px rgba(0, 123, 255, 0.5);
            text-transform: uppercase;
        }

        .btn-add-admin {
            background: linear-gradient(135deg, #F4A261, #E76F51);
            border: none;
            color: white;
            font-weight: 600;
            border-radius: 999px;
            padding: 8px 16px;
            box-shadow: 0 0 12px rgba(244, 162, 97, 0.5);
            transition: 0.3s ease;
        }

        .btn-add-admin:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 18px rgba(244, 162, 97, 0.8);
        }

        .btn-back-dashboard {
            background: linear-gradient(135deg, #007bff, #001f4d);
            border: none;
            color: white;
            font-weight: 600;
            border-radius: 999px;
            padding: 8px 16px;
            box-shadow: 0 0 12px rgba(0, 123, 255, 0.4);
            transition: 0.3s ease;
        }

        .btn-back-dashboard:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 18px rgba(0, 123, 255, 0.7);
        }

    </style>
</head>

<body>

<div class="container mt-4">

    <div class="header mb-3 text-center">
        <h3>Admin Management</h3>
    </div>

    <div class="table-card">
        <div class="d-flex justify-content-between align-items-center mb-3">

            <h5 class="mb-0 fw-bold">Admin List</h5>

            <div class="d-flex gap-2">

                <!-- BACK TO DASHBOARD -->
                <a href="/admin/dashboard" class="btn btn-back-dashboard">
                    ← Dashboard
                </a>

                <!-- ADD ADMIN -->
                <a href="/admin/new" class="btn btn-add-admin">
                    + Add Admin
                </a>

            </div>

        </div>

        <table class="table table-hover align-middle">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
                <th>Actions</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="admin : ${admins}">
                <td th:text="${admin.adminId}"></td>
                <td th:text="${admin.fullName}"></td>
                <td th:text="${admin.email}"></td>

                <td>

                    <span th:if="${admin.role == 'SUPER_ADMIN' || admin.default}"
                          class="badge-super">
                          SUPER ADMIN
                    </span>

                    <span th:if="${admin.role == 'ADMIN' && !admin.default}"
                          class="badge-admin">
                          ADMIN
                    </span>

                </td>

                <td class="text-center">
                    <!-- EDIT -->
                    <a th:if="${loggedInAdmin.role == 'SUPER_ADMIN' || loggedInAdmin.default}"
                       th:href="@{'/admin/edit/' + ${admin.adminId}}"
                       class="btn btn-sm btn-warning btn-sm me-1 rounded-pill px-3 shadow-sm">
                        <i class="bi bi-pencil-square"></i>Edit
                    </a>

                    <a th:href="@{'/admin/delete/' + ${admin.adminId}}"
                       class="btn btn-danger btn-sm rounded-pill px-3 shadow-sm"
                       onclick="return confirm('Are you sure you want to delete this admin?');">
                        <i class="bi bi-trash-fill"></i> Delete
                    </a>


                </td>
            </tr>
            </tbody>
        </table>

    </div>
</div>

</body>
</html>

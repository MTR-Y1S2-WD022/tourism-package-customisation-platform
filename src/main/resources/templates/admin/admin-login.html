<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Staff Portal Login - Ceylon Dream Travels</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        :root {
            --ceylon-green: #1B4332;
            --ceylon-gold: #F4A261;
        }

        body {
            min-height: 100vh;
            background-color: var(--ceylon-green);
            font-family: Arial, sans-serif;
        }

        .staff-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 15px;
        }

        .staff-card {
            width: 100%;
            max-width: 430px;
            background-color: #ffffff;
            border-radius: 24px;
            padding: 42px 36px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
        }

        .staff-icon {
            width: 78px;
            height: 78px;
            border-radius: 50%;
            background-color: #e9f7ef;
            color: var(--ceylon-green);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            margin: 0 auto 20px auto;
        }

        .staff-title {
            color: var(--ceylon-green);
            font-weight: 800;
        }

        .form-control-lg {
            border-radius: 14px;
        }

        .btn-staff {
            background-color: var(--ceylon-green);
            border-color: var(--ceylon-green);
            color: #ffffff;
            font-weight: 800;
            border-radius: 999px;
            padding: 12px;
        }

        .btn-staff:hover {
            background-color: #102A23;
            border-color: #102A23;
            color: #ffffff;
        }

        .back-link {
            color: rgba(255, 255, 255, 0.80);
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            color: var(--ceylon-gold);
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="staff-wrapper">
    <div>
        <div class="staff-card">

            <div class="staff-icon">
                <i class="bi bi-shield-lock-fill"></i>
            </div>

            <div class="text-center mb-4">
                <h3 class="staff-title mb-1">Staff Portal Login</h3>
                <p class="text-muted mb-0">Authorized personnel only</p>
            </div>

            <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
                <span th:text="${errorMessage}"></span>
            </div>

            <form th:action="@{/admin/login}" method="post">

                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold">Admin Email</label>
                    <input type="email"
                           class="form-control form-control-lg"
                           id="email"
                           name="email"
                           placeholder="Enter admin email"
                           required>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label fw-semibold">Password</label>
                    <input type="password"
                           class="form-control form-control-lg"
                           id="password"
                           name="password"
                           placeholder="Enter password"
                           required>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-staff btn-lg">
                        Login
                    </button>
                </div>

            </form>
        </div>

        <div class="text-center mt-4">
            <a th:href="@{/}" class="back-link">
                <i class="bi bi-arrow-left"></i>
                Back to Public Website
            </a>
        </div>
    </div>
</div>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Cancellation Requests</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <h2 class="mb-4">Booking Cancellation Requests</h2>

    <table class="table table-bordered table-striped">

        <thead class="table-dark">
        <tr>
            <th>Request ID</th>
            <th>Booking ID</th>
            <th>User ID</th>
            <th>Reason</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="req : ${requests}">
            <td th:text="${req.requestId}"></td>
            <td th:text="${req.bookingId}"></td>
            <td th:text="${req.userId}"></td>
            <td th:text="${req.reason}"></td>
            <td th:text="${req.requestStatus}"></td>

            <td>

                <a th:href="@{/cancellation/admin/approve/{id}(id=${req.requestId})}"
                   class="btn btn-success btn-sm">
                    Approve
                </a>

                <a th:href="@{/cancellation/admin/reject/{id}(id=${req.requestId})}"
                   class="btn btn-danger btn-sm">
                    Reject
                </a>

            </td>
        </tr>

        </tbody>

    </table>

</div>

</body>
</html>

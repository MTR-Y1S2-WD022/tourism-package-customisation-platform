<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - Tourism Platform</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/admin/dashboard">Tourism Admin Panel</a>

        <div class="d-flex">
            <a class="btn btn-outline-light btn-sm" th:href="@{/admin/logout}">
                Logout
            </a>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h3 class="card-title mb-2">Admin Dashboard</h3>

            <p class="mb-1">
                Welcome,
                <strong th:text="${admin.fullName}">Admin Name</strong>
            </p>

            <p class="text-muted mb-0">
                Role:
                <span th:text="${admin.role}">ADMIN</span>
            </p>
        </div>
    </div>

    <div class="row g-4">

        <div class="col-md-4">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Manage Admins</h5>
                    <p class="card-text">
                        Add, view, edit, and deactivate admin accounts.
                    </p>
                    <a th:href="@{/admin/list}" class="btn btn-primary">
                        Admin List
                    </a>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Manage Users</h5>
                    <p class="card-text">
                        View, edit, and deactivate user accounts.
                    </p>
                    <a th:href="@{/admin/users}" class="btn btn-primary">
                        User List
                    </a>
                </div>
            </div>
        </div>

    </div>

</div>

</body>
</html>

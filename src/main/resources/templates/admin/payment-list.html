<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Payments</title>
    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div class="container-fluid mt-5">

    <div class="card shadow">
        <div class="card-header bg-dark text-white">
            <h3 class="mb-0">Admin Payment Management</h3>
        </div>

        <div class="card-body">

            <div th:if="${#lists.isEmpty(payments)}" class="alert alert-warning">
                No payment records found.
            </div>

            <div th:if="${!#lists.isEmpty(payments)}" class="table-responsive">
                <table class="table table-bordered table-hover align-middle">
                    <thead class="table-dark">
                    <tr>
                        <th>Payment ID</th>
                        <th>Booking ID</th>
                        <th>User ID</th>
                        <th>Method</th>
                        <th>Amount</th>
                        <th>Payment Status</th>
                        <th>Refund Status</th>
                        <th>Refund Amount</th>
                        <th>Payment Date</th>
                        <th>Update Status</th>
                        <th>Refund</th>
                        <th>Cancel</th>
                        <th>Delete</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="payment : ${payments}">
                        <td th:text="${payment.paymentId}">1</td>
                        <td th:text="${payment.bookingId}">1</td>
                        <td th:text="${payment.userId}">1</td>
                        <td th:text="${payment.paymentMethod}">CARD</td>
                        <td th:text="${payment.amount}">50000.00</td>

                        <td>
                            <span class="badge"
                                  th:classappend="${payment.paymentStatus == 'PAID'} ? ' bg-success' :
                                                  (${payment.paymentStatus == 'PENDING'} ? ' bg-warning text-dark' :
                                                  (${payment.paymentStatus == 'FAILED'} ? ' bg-danger' :
                                                  (${payment.paymentStatus == 'CANCELLED'} ? ' bg-secondary' :
                                                  (${payment.paymentStatus == 'REFUNDED'} ? ' bg-info text-dark' :
                                                  ' bg-dark'))))"
                                  th:text="${payment.paymentStatus}">
                                PAID
                            </span>
                        </td>

                        <td th:text="${payment.refundStatus}">NONE</td>
                        <td th:text="${payment.refundAmount}">0.00</td>
                        <td th:text="${payment.paymentDate}">2026-05-11T10:30</td>

                        <td>
                            <form th:action="@{/admin/payments/status/{paymentId}(paymentId=${payment.paymentId})}"
                                  method="post"
                                  class="d-flex gap-2">

                                <select name="paymentStatus" class="form-select form-select-sm" required>
                                    <option value="">Select</option>
                                    <option value="PAID">PAID</option>
                                    <option value="FAILED">FAILED</option>
                                    <option value="CANCELLED">CANCELLED</option>
                                    <option value="REFUNDED">REFUNDED</option>
                                    <option value="PARTIALLY_REFUNDED">PARTIALLY_REFUNDED</option>
                                </select>

                                <button type="submit" class="btn btn-sm btn-primary">
                                    Update
                                </button>
                            </form>
                        </td>

                        <td>
                            <form th:action="@{/admin/payments/refund/full/{bookingId}(bookingId=${payment.bookingId})}"
                                  method="post"
                                  class="mb-2">
                                <button type="submit"
                                        class="btn btn-sm btn-info w-100"
                                        th:disabled="${payment.paymentStatus != 'PAID'}">
                                    Full Refund
                                </button>
                            </form>

                            <form th:action="@{/admin/payments/refund/custom/{bookingId}(bookingId=${payment.bookingId})}"
                                  method="post"
                                  class="d-flex gap-2">
                                <input type="number"
                                       step="0.01"
                                       min="0"
                                       name="refundAmount"
                                       class="form-control form-control-sm"
                                       placeholder="Amount"
                                       th:disabled="${payment.paymentStatus != 'PAID'}"
                                       required>

                                <button type="submit"
                                        class="btn btn-sm btn-warning"
                                        th:disabled="${payment.paymentStatus != 'PAID'}">
                                    Custom
                                </button>
                            </form>
                        </td>

                        <td>
                            <form th:action="@{/admin/payments/cancel/{paymentId}(paymentId=${payment.paymentId})}"
                                  method="post">
                                <button type="submit"
                                        class="btn btn-sm btn-secondary"
                                        th:disabled="${payment.paymentStatus == 'CANCELLED'
                                                   || payment.paymentStatus == 'REFUNDED'
                                                   || payment.paymentStatus == 'PARTIALLY_REFUNDED'}">
                                    Cancel
                                </button>
                            </form>
                        </td>

                        <td>
                            <form th:action="@{/admin/payments/delete/{paymentId}(paymentId=${payment.paymentId})}"
                                  method="post"
                                  onsubmit="return confirm('Are you sure you want to delete this payment record?');">
                                <button type="submit" class="btn btn-sm btn-danger">
                                    Delete
                                </button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <a href="/" class="btn btn-secondary mt-3">
                Back to Home
            </a>

        </div>
    </div>

</div>

</body>
</html>

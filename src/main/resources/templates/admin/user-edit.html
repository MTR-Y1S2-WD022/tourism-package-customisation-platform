<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit User - Ceylon Dream Travels Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        :root {
            --ceylon-green: #102A23;
            --ceylon-gold: #F4A261;
            --ceylon-bg: #FDFBF7;
        }

        body {
            background-color: var(--ceylon-bg);
            font-family: Arial, sans-serif;
        }

        .admin-header {
            background-color: var(--ceylon-green);
            color: white;
            padding: 30px;
            border-radius: 18px;
            margin-bottom: 30px;
        }

        .edit-card {
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            padding: 35px;
            border: none;
        }

        .form-label {
            color: var(--ceylon-green);
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }

        .form-control {
            border-radius: 10px;
            border: 1px solid #dee2e6;
            padding: 12px 15px;
        }

        .form-control:focus {
            border-color: var(--ceylon-gold);
            box-shadow: 0 0 0 0.25rem rgba(244, 162, 97, 0.25);
        }

        .btn-gold {
            background-color: var(--ceylon-gold);
            color: #3b2412;
            font-weight: 700;
            border-radius: 999px;
            padding: 12px 30px;
            transition: 0.3s;
            border: none;
        }

        .btn-gold:hover {
            background-color: #e78f4e;
            transform: translateY(-2px);
        }

        .btn-outline-light-custom {
            border: 2px solid rgba(255,255,255,0.5);
            color: white;
            border-radius: 999px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-outline-light-custom:hover {
            background-color: white;
            color: var(--ceylon-green);
        }
    </style>
</head>
<body class="py-5">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-8">

            <div class="admin-header d-flex justify-content-between align-items-center shadow-sm">
                <div>
                    <h3 class="fw-bold mb-1"><i class="bi bi-person-gear text-warning me-2"></i> Edit User Details</h3>
                    <p class="text-white-50 mb-0 small">Update user profile information and credentials.</p>
                </div>
                <a th:href="@{/admin/users}" class="btn btn-outline-light-custom px-4 shadow-sm">
                    <i class="bi bi-arrow-left me-1"></i> Cancel & Back
                </a>
            </div>

            <div th:if="${errorMessage}" class="alert alert-danger shadow-sm border-0 rounded-3">
                <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${errorMessage}"></span>
            </div>

            <div class="card edit-card">
                <form th:action="@{/admin/users/update}" method="post" th:object="${user}">

                    <input type="hidden" th:field="*{userId}">

                    <div class="row g-4">
                        <div class="col-md-6">
                            <label class="form-label"><i class="bi bi-person me-1 text-secondary"></i> Full Name</label>
                            <input type="text" class="form-control bg-light" th:field="*{fullName}" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label"><i class="bi bi-envelope me-1 text-secondary"></i> Email Address</label>
                            <input type="email" class="form-control bg-light" th:field="*{email}" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label"><i class="bi bi-telephone me-1 text-secondary"></i> Phone Number</label>
                            <input type="text" class="form-control bg-light" th:field="*{phoneNumber}" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label"><i class="bi bi-shield-lock me-1 text-secondary"></i> New Password</label>
                            <input type="password" name="password" class="form-control bg-light" placeholder="Leave blank to keep current">
                        </div>

                        <div class="col-12">
                            <label class="form-label"><i class="bi bi-geo-alt me-1 text-secondary"></i> Physical Address</label>
                            <textarea class="form-control bg-light" rows="3" th:field="*{address}" required></textarea>
                        </div>

                        <div class="col-12 mt-5 text-end border-top pt-4">
                            <button type="submit" class="btn btn-gold shadow-sm">
                                <i class="bi bi-save-fill me-2"></i> Save User Changes
                            </button>
                        </div>
                    </div>
                </form>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

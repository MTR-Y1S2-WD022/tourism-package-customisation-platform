<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Management - Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        :root {
            --ceylon-green: #102A23;
            --ceylon-gold: #F4A261;
        }

        body {
            background-color: #FDFBF7;
        }

        .header {
            background: var(--ceylon-green);
            color: white;
            padding: 20px;
            border-radius: 15px;
        }

        .table-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #007bff, #001f4d);
            border: none;
            color: white;
            font-weight: 600;
            border-radius: 999px;
            padding: 8px 16px;
            box-shadow: 0 0 12px rgba(0, 123, 255, 0.4);
            transition: 0.3s ease;
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 18px rgba(0, 123, 255, 0.7);
            color: white;
        }
    </style>
</head>

<body>

<div class="container mt-4 mb-5">

    <div class="header text-center mb-4">
        <h3 class="mb-0 fw-bold">User Management</h3>
    </div>

    <div th:if="${param.message}" class="alert alert-success shadow-sm rounded-3">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${param.message}"></span>
    </div>

    <div class="table-card">

        <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
            <h4 class="mb-0 fw-bold" style="color: var(--ceylon-green);">
                User List
            </h4>

            <a th:href="@{/admin/dashboard}" class="btn btn-secondary">
                ← Dashboard
            </a>
        </div>

        <table class="table table-hover align-middle">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th class="rounded-end text-center">Actions</th>
            </tr>
            </thead>

            <tbody>
            <tr th:if="${#lists.isEmpty(users)}">
                <td colspan="4" class="text-center text-muted py-4">No users found.</td>
            </tr>

            <tr th:each="user : ${users}">
                <td class="ps-3 fw-bold" th:text="${user.userId}"></td>
                <td th:text="${user.fullName}"></td>
                <td th:text="${user.email}"></td>

                <td class="text-center">
                    <a th:href="@{'/admin/users/edit/' + ${user.userId}}"
                       class="btn btn-warning btn-sm me-1 rounded-pill px-3 shadow-sm">
                        <i class="bi bi-pencil-square"></i> Edit
                    </a>

                    <a th:href="@{'/admin/users/delete/' + ${user.userId}}"
                       class="btn btn-danger btn-sm rounded-pill px-3 shadow-sm"
                       onclick="return confirm('Are you sure you want to delete this user?');">
                        <i class="bi bi-trash-fill"></i> Delete
                    </a>
                </td>
            </tr>
            </tbody>
        </table>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

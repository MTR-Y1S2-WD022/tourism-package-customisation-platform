<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --ceylon-green: #102A23;
            --ceylon-gold: #F4A261;
        }

        body {
            background-color: #FDFBF7;
        }

        .header {
            background: var(--ceylon-green);
            color: white;
            padding: 20px;
            border-radius: 15px;
        }

        .table-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        .badge-active {
            background: #198754;
            color: white;
            padding: 5px 10px;
            border-radius: 999px;
        }

        .badge-inactive {
            background: #dc3545;
            color: white;
            padding: 5px 10px;
            border-radius: 999px;
        }
    </style>
</head>

<body>

<div class="container mt-4">

    <div class="header text-center mb-3">
        <h3>User Management</h3>
    </div>

    <div class="table-card">

        <table class="table table-hover">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="user : ${users}">
                <td th:text="${user.userId}"></td>
                <td th:text="${user.fullName}"></td>
                <td th:text="${user.email}"></td>

                <td>
                    <span th:if="${user.status == 'ACTIVE'}" class="badge-active">ACTIVE</span>
                    <span th:if="${user.status == 'INACTIVE'}" class="badge-inactive">INACTIVE</span>
                </td>

                <td>

                    <a th:href="@{'/admin/users/edit/' + ${user.userId}}"
                       class="btn btn-warning btn-sm">
                        Edit
                    </a>

                    <a th:if="${user.status == 'ACTIVE'}"
                       th:href="@{'/admin/users/deactivate/' + ${user.userId}}"
                       class="btn btn-danger btn-sm">
                        Deactivate
                    </a>

                    <a th:if="${user.status == 'INACTIVE'}"
                       th:href="@{'/admin/users/activate/' + ${user.userId}}"
                       class="btn btn-success btn-sm">
                        Activate
                    </a>

                </td>
            </tr>
            </tbody>
        </table>

    </div>
</div>

</body>
</html>

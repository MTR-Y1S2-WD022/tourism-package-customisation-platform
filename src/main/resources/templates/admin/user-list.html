<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User List - Tourism Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" th:href="@{/admin/dashboard}">Tourism Admin Panel</a>

        <div class="d-flex gap-2">
            <a class="btn btn-outline-light btn-sm" th:href="@{/admin/dashboard}">Dashboard</a>
            <a class="btn btn-outline-light btn-sm" th:href="@{/admin/list}">Admin List</a>
            <a class="btn btn-outline-light btn-sm" th:href="@{/admin/logout}">Logout</a>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>User List</h3>

        <a th:href="@{/admin/dashboard}" class="btn btn-secondary">
            Back to Dashboard
        </a>
    </div>

    <div th:if="${message}" class="alert alert-info">
        <span th:text="${message}"></span>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">

            <div class="table-responsive">
                <table class="table table-bordered table-striped align-middle">
                    <thead class="table-primary">
                    <tr>
                        <th>ID</th>
                        <th>Full Name</th>
                        <th>Email</th>
                        <th>Phone Number</th>
                        <th>Address</th>
                        <th>Profile Image</th>
                        <th>Status</th>
                        <th>Created At</th>
                        <th style="width: 170px;">Actions</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="user : ${users}">
                        <td th:text="${user.userId}">1</td>
                        <td th:text="${user.fullName}">User Name</td>
                        <td th:text="${user.email}">user@gmail.com</td>
                        <td th:text="${user.phoneNumber}">0771234567</td>
                        <td th:text="${user.address}">Address</td>
                        <td th:text="${user.profileImage}">user1.jpg</td>
                        <td>
                            <span th:if="${user.status == 'ACTIVE'}" class="badge bg-success">ACTIVE</span>
                            <span th:if="${user.status == 'INACTIVE'}" class="badge bg-secondary">INACTIVE</span>
                        </td>
                        <td th:text="${user.createdAt}">2026-01-01</td>
                        <td>
                            <a th:href="@{/admin/users/edit/{userId}(userId=${user.userId})}"
                               class="btn btn-sm btn-warning">
                                Edit
                            </a>

                            <a th:if="${user.status == 'ACTIVE'}"
                               th:href="@{/admin/users/deactivate/{userId}(userId=${user.userId})}"
                               class="btn btn-sm btn-danger"
                               onclick="return confirm('Are you sure you want to deactivate this user?');">
                                Deactivate
                            </a>

                            <span th:if="${user.status == 'INACTIVE'}" class="text-muted small d-block mt-1">
                                Already inactive
                            </span>
                        </td>
                    </tr>

                    <tr th:if="${users == null or users.isEmpty()}">
                        <td colspan="9" class="text-center text-muted">
                            No users found.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

</div>

</body>
</html>

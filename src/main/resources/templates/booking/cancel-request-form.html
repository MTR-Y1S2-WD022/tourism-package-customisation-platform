<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Cancel Booking Request</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-danger text-white">
            <h3 class="mb-0">Cancel Booking Request</h3>
        </div>

        <div class="card-body">

            <form th:action="@{/cancellation/request}" method="post">

                <input type="hidden" name="bookingId" th:value="${request.bookingId}">

                <div class="mb-3">
                    <label class="form-label">Reason for Cancellation</label>
                    <textarea name="reason" class="form-control" rows="4"
                              placeholder="Enter your reason here..." required></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Refund Type (optional)</label>
                    <select name="refundType" class="form-select">
                        <option value="NONE">NONE</option>
                        <option value="FULL">FULL</option>
                        <option value="CUSTOM">CUSTOM</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Refund Amount (optional)</label>
                    <input type="number" name="refundAmount" class="form-control" value="0">
                </div>

                <button type="submit" class="btn btn-danger">
                    Submit Cancellation Request
                </button>

                <a th:href="@{/booking/details/{id}(id=${request.bookingId})}"
                   class="btn btn-secondary">
                    Back
                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>

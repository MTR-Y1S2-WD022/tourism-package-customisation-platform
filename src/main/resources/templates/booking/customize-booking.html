<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Customize Booking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5 mb-5">

    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h3 class="mb-0">Customize Your Booking</h3>
        </div>

        <div class="card-body">

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}">
                Error message
            </div>

            <form th:action="@{/booking/summary}" method="post">

                <input type="hidden" name="userId" value="1">
                <input type="hidden" name="packageId" th:value="${packageId}">
                <input type="hidden" name="packageBasePrice" value="30000">

                <h5 class="mb-3">Travel Dates</h5>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Start Date</label>
                        <input type="date" name="startDate" class="form-control" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">End Date</label>
                        <input type="date" name="endDate" class="form-control" required>
                    </div>
                </div>

                <hr>

                <!-- ✅ NEW SECTION: NUMBER OF MEMBERS -->
                <h5 class="mb-3">Group Details</h5>

                <div class="row mb-3">
                    <div class="col-md-4">
                        <label class="form-label">Number of Members</label>
                        <input type="number" name="numberOfMembers"
                               class="form-control"
                               min="1"
                               value="1"
                               required>
                    </div>
                </div>

                <hr>

                <h5 class="mb-3">Select Destinations</h5>

                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="selectedDestinationIds" value="1" checked>
                    <input type="hidden" name="selectedDestinationCosts" value="8000">
                    <label class="form-check-label">
                        Sigiriya - Rs. 8000
                    </label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="selectedDestinationIds" value="2" checked>
                    <input type="hidden" name="selectedDestinationCosts" value="6000">
                    <label class="form-check-label">
                        Kandy - Rs. 6000
                    </label>
                </div>

                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" name="selectedDestinationIds" value="3" checked>
                    <input type="hidden" name="selectedDestinationCosts" value="7000">
                    <label class="form-check-label">
                        Ella - Rs. 7000
                    </label>
                </div>

                <hr>

                <h5 class="mb-3">Hotel, Meal and Guide Options</h5>

                <div class="row mb-3">
                    <div class="col-md-4">
                        <label class="form-label">Hotel Type</label>
                        <select name="hotelType" class="form-select" required>
                            <option value="">Select Hotel</option>
                            <option th:each="hotel : ${hotelTypes}"
                                    th:value="${hotel}"
                                    th:text="${hotel}">
                            </option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Meal Option</label>
                        <select name="mealOption" class="form-select" required>
                            <option value="">Select Meal</option>
                            <option th:each="meal : ${mealOptions}"
                                    th:value="${meal}"
                                    th:text="${meal}">
                            </option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Guide Option</label>
                        <select name="guideOption" class="form-select" required>
                            <option value="">Select Guide</option>
                            <option th:each="guide : ${guideOptions}"
                                    th:value="${guide}"
                                    th:text="${guide}">
                            </option>
                        </select>
                    </div>
                </div>

                <hr>

                <h5 class="mb-3">Coupon</h5>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Coupon ID Optional</label>
                        <input type="number" name="couponId" class="form-control" placeholder="Example: 1">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Discount Amount Temporary</label>
                        <input type="number" name="discountAmount" class="form-control" value="0" min="0">
                    </div>
                </div>

                <div class="alert alert-info">
                    Coupon validation will be connected later with the Coupon Management Module.
                    For now, you can enter a temporary discount amount for testing.
                </div>

                <div class="d-flex justify-content-between">
                    <a href="/" class="btn btn-secondary">Back to Home</a>
                    <button type="submit" class="btn btn-success">View Booking Summary</button>
                </div>

            </form>

        </div>
    </div>

</div>

</body>
</html>

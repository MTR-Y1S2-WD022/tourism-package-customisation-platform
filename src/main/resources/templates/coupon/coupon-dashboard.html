<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Coupon Dashboard</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
        background: #f4f7fb;
        font-family: Arial, sans-serif;
    }

    .dashboard-header {
        background: linear-gradient(135deg, #20c997, #20c997);
        color: white;
        border-radius: 22px;
        padding: 35px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
    }

    .stat-card {
        border: none;
        border-radius: 18px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        transition: 0.3s;
    }

    .stat-card:hover {
        transform: translateY(-5px);
    }

    .icon-box {
        width: 55px;
        height: 55px;
        border-radius: 15px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 26px;
    }

    .quick-card {
        border: none;
        border-radius: 18px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.07);
    }

    .btn-custom {
        border-radius: 12px;
        padding: 10px 18px;
        font-weight: 600;
    }




    .section-title {
        font-weight: 700;
        color: #263238;
    }

    .small-text {
        color: #6c757d;
        font-size: 14px;
    }
  </style>
</head>

<body>

<div class="container py-5">

  <div class="dashboard-header mb-5">
    <div class="row align-items-center">
      <div class="col-md-8">
        <h1 class="fw-bold mb-2">Coupon Management Dashboard</h1>
        <p class="mb-0">
          Manage discount coupons, monitor active offers, and control cancelled or expired coupons.
        </p>
      </div>

      <div class="col-md-4 text-md-end mt-4 mt-md-0">
        <a th:href="@{/admin/coupons/new}" class="btn btn-light btn-custom me-2">
          <i class="bi bi-plus-circle"></i> Add Coupon
        </a>


      </div>
    </div>
  </div>

  <div class="row g-4 mb-5">

    <div class="col-md-3">
      <div class="card stat-card">
        <div class="card-body d-flex align-items-center">
          <div class="icon-box bg-primary text-white me-3">
            <i class="bi bi-ticket-perforated"></i>
          </div>
          <div>
            <h4 class="fw-bold mb-0" th:text="${totalCoupons}">0</h4>
            <p class="small-text mb-0">Total Coupons</p>
          </div>
        </div>
      </div>
    </div>

    <div class="col-md-3">
      <div class="card stat-card">
        <div class="card-body d-flex align-items-center">
          <div class="icon-box bg-success text-white me-3">
            <i class="bi bi-check-circle"></i>
          </div>
          <div>
            <h4 class="fw-bold mb-0" th:text="${activeCoupons}">0</h4>
            <p class="small-text mb-0">Active Coupons</p>
          </div>
        </div>
      </div>
    </div>

    <div class="col-md-3">
      <div class="card stat-card">
        <div class="card-body d-flex align-items-center">
          <div class="icon-box bg-warning text-dark me-3">
            <i class="bi bi-clock-history"></i>
          </div>
          <div>
            <h4 class="fw-bold mb-0" th:text="${expiredCoupons}">0</h4>
            <p class="small-text mb-0">Expired Coupons</p>
          </div>
        </div>
      </div>
    </div>

    <div class="col-md-3">
      <div class="card stat-card">
        <div class="card-body d-flex align-items-center">
          <div class="icon-box bg-danger text-white me-3">
            <i class="bi bi-x-circle"></i>
          </div>
          <div>
            <h4 class="fw-bold mb-0" th:text="${cancelledCoupons}">0</h4>
            <p class="small-text mb-0">Cancelled Coupons</p>
          </div>
        </div>
      </div>
    </div>

  </div>

  <div class="row g-4">

    <div class="col-md-7 mx-auto">
      <div class="card quick-card text-center">
        <div class="card-body p-4">
          <h4 class="section-title mb-3">Quick Actions</h4>

          <div class="row g-3 justify-content-center">
            <div class="col-md-6">
              <a th:href="@{/admin/coupons/new}" class="btn btn-primary w-100 btn-custom">
                <i class="bi bi-plus-lg"></i> Create New Coupon
              </a>
            </div>

            <div class="col-md-6">
              <a th:href="@{/admin/coupons/list}" class="btn btn-success w-100 btn-custom">
                <i class="bi bi-table"></i> Manage Coupons
              </a>
            </div>

            <div class="col-md-6">

            </div>

            <div class="col-md-6">

            </div>




          </div>

        </div>
      </div>
    </div>



  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

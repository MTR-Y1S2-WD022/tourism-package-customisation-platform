<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Coupon Form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h3 class="mb-0" th:if="${coupon.couponId == 0}">Add New Coupon</h3>
            <h3 class="mb-0" th:if="${coupon.couponId != 0}">Update Coupon</h3>
        </div>

        <div class="card-body">

            <form th:action="${coupon.couponId == 0} ? @{/admin/coupons/save} : @{/admin/coupons/update}"
                  th:object="${coupon}"
                  method="post">

                <input type="hidden" th:field="*{couponId}">

                <div class="mb-3">
                    <label class="form-label">Coupon Code</label>
                    <input type="text"
                           th:field="*{couponCode}"
                           class="form-control"
                           placeholder="Example: WELCOME10"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Discount Type</label>
                    <select th:field="*{discountType}" class="form-select" required>
                        <option value="">-- Select Discount Type --</option>
                        <option value="PERCENTAGE">PERCENTAGE</option>
                        <option value="FIXED">FIXED</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Discount Value</label>
                    <input type="number"
                           th:field="*{discountValue}"
                           class="form-control"
                           step="0.01"
                           min="0.01"
                           placeholder="Example: 10.00"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Issue Date</label>
                    <input type="date"
                           th:field="*{issueDate}"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Expiry Date</label>
                    <input type="date"
                           th:field="*{expiryDate}"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Status</label>
                    <select th:field="*{status}" class="form-select">
                        <option value="ACTIVE">ACTIVE</option>
                        <option value="EXPIRED">EXPIRED</option>
                        <option value="CANCELLED">CANCELLED</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Created By Admin ID</label>
                    <input type="number"
                           th:field="*{createdByAdminId}"
                           class="form-control"
                           placeholder="Example: 1">
                </div>

                <div class="d-flex justify-content-between">
                    <a th:href="@{/admin/coupons}" class="btn btn-secondary">Back</a>
                    <button type="submit" class="btn btn-success">Save Coupon</button>
                </div>

            </form>

        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

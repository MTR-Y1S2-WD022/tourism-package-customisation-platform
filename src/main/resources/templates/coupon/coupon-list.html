<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Coupon List</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Coupon Management</h2>
        <a th:href="@{/admin/coupons/new}" class="btn btn-primary">Add New Coupon</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">

            <table class="table table-bordered table-hover align-middle">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Coupon Code</th>
                    <th>Discount Type</th>
                    <th>Discount Value</th>
                    <th>Issue Date</th>
                    <th>Expiry Date</th>
                    <th>Status</th>
                    <th>Created By Admin ID</th>
                    <th>Actions</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="coupon : ${coupons}">
                    <td th:text="${coupon.couponId}"></td>
                    <td th:text="${coupon.couponCode}"></td>
                    <td th:text="${coupon.discountType}"></td>
                    <td th:text="${coupon.discountValue}"></td>
                    <td th:text="${coupon.issueDate}"></td>
                    <td th:text="${coupon.expiryDate}"></td>

                    <td>
                        <span th:if="${coupon.status == 'ACTIVE'}"
                              class="badge bg-success"
                              th:text="${coupon.status}">
                        </span>

                        <span th:if="${coupon.status == 'EXPIRED'}"
                              class="badge bg-warning text-dark"
                              th:text="${coupon.status}">
                        </span>

                        <span th:if="${coupon.status == 'CANCELLED'}"
                              class="badge bg-danger"
                              th:text="${coupon.status}">
                        </span>
                    </td>

                    <td th:text="${coupon.createdByAdminId}"></td>

                    <td>
                        <a th:href="@{/admin/coupons/edit/{couponId}(couponId=${coupon.couponId})}"
                           class="btn btn-sm btn-warning">
                            Edit
                        </a>

                        <a th:href="@{/admin/coupons/cancel/{couponId}(couponId=${coupon.couponId})}"
                           class="btn btn-sm btn-danger"
                           onclick="return confirm('Are you sure you want to cancel this coupon?');">
                            Cancel
                        </a>

                        <form th:action="@{/admin/coupons/extend/{couponId}(couponId=${coupon.couponId})}"
                              method="post"
                              class="d-inline-block mt-2">
                            <input type="date" name="newExpiryDate" class="form-control form-control-sm mb-1" required>
                            <button type="submit" class="btn btn-sm btn-info">Extend</button>
                        </form>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(coupons)}">
                    <td colspan="9" class="text-center text-muted">
                        No coupons found.
                    </td>
                </tr>
                </tbody>
            </table>

        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

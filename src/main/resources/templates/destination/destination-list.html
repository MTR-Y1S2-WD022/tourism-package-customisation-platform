<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Destinations</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark" style="background-color:#2e7d32;">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Tourism Platform</a>

        <div class="d-flex gap-2">
            <a class="btn btn-outline-light btn-sm" th:href="@{/packages}">Packages</a>
            <a class="btn btn-outline-light btn-sm" th:href="@{/destinations}">Destinations</a>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Destinations</h2>
        <a class="btn btn-success" th:href="@{/destinations/new}">Add New Destination</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">

            <table class="table table-bordered table-hover align-middle">
                <thead class="table-primary">
                <tr>
                    <th>ID</th>
                    <th>Destination Name</th>
                    <th>Base Cost</th>
                    <th>Google Map</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="destination : ${destinations}">
                    <td th:text="${destination.destinationId}">1</td>
                    <td th:text="${destination.destinationName}">Sample Destination</td>
                    <td th:text="${destination.baseCost}">5000.00</td>

                    <td>
                        <a th:if="${destination.googleMapUrl != null and !destination.googleMapUrl.isEmpty()}"
                           class="btn btn-outline-primary btn-sm"
                           th:href="${destination.googleMapUrl}"
                           target="_blank">
                            Open Map
                        </a>

                        <span th:if="${destination.googleMapUrl == null or destination.googleMapUrl.isEmpty()}"
                              class="text-muted">
                            No map link
                        </span>
                    </td>

                    <td>
                        <span class="badge bg-success" th:text="${destination.status}">ACTIVE</span>
                    </td>

                    <td>
                        <a class="btn btn-warning btn-sm"
                           th:href="@{/destinations/edit/{id}(id=${destination.destinationId})}">
                            Edit
                        </a>

                        <a class="btn btn-danger btn-sm"
                           th:href="@{/destinations/delete/{id}(id=${destination.destinationId})}"
                           onclick="return confirm('Are you sure you want to deactivate this destination?');">
                            Deactivate
                        </a>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(destinations)}">
                    <td colspan="6" class="text-center text-muted">No destinations found.</td>
                </tr>
                </tbody>
            </table>

        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

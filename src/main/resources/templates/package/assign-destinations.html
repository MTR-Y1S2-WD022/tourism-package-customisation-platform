<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Assign Destinations</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Tourism Platform</a>

        <div class="d-flex gap-2">
            <a class="btn btn-outline-light btn-sm" th:href="@{/packages}">Packages</a>
            <a class="btn btn-outline-light btn-sm" th:href="@{/destinations}">Destinations</a>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">
                Assign Destinations to:
                <span th:text="${tourPackage.packageName}">Package Name</span>
            </h4>
        </div>

        <div class="card-body">

            <form th:action="@{/packages/{id}/assign-destinations(id=${tourPackage.packageId})}"
                  method="post">

                <div class="mb-3">
                    <p class="text-muted">
                        Select the destinations that belong to this package.
                    </p>
                </div>

                <div class="list-group mb-4">

                    <label class="list-group-item"
                           th:each="destination : ${destinations}">

                        <input class="form-check-input me-2"
                               type="checkbox"
                               name="destinationIds"
                               th:value="${destination.destinationId}"
                               th:checked="${assignedDestinationIds.contains(destination.destinationId)}">

                        <strong th:text="${destination.destinationName}">Destination Name</strong>

                        <span class="text-muted ms-2">
                            Rs. <span th:text="${destination.baseCost}">0.00</span>
                        </span>
                    </label>

                    <div th:if="${#lists.isEmpty(destinations)}"
                         class="alert alert-warning">
                        No active destinations available. Please add destinations first.
                    </div>

                </div>

                <div class="d-flex justify-content-between">
                    <a class="btn btn-secondary"
                       th:href="@{/packages/view/{id}(id=${tourPackage.packageId})}">
                        Back
                    </a>

                    <button type="submit" class="btn btn-success">
                        Save Assigned Destinations
                    </button>
                </div>

            </form>

        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

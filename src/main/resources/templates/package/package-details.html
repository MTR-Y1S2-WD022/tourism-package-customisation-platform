<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Package Details</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Tourism Platform</a>

        <div class="d-flex gap-2">
            <a class="btn btn-outline-light btn-sm" th:href="@{/packages}">Packages</a>
            <a class="btn btn-outline-light btn-sm" th:href="@{/destinations}">Destinations</a>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <h4 class="mb-0">Package Details</h4>
            <span class="badge bg-light text-primary" th:text="${tourPackage.status}">ACTIVE</span>
        </div>

        <div class="card-body">

            <div class="row">
                <div class="col-md-5 mb-3">
                    <img th:if="${tourPackage.imageUrl != null and !tourPackage.imageUrl.isEmpty()}"
                         th:src="${tourPackage.imageUrl}"
                         alt="Package Image"
                         class="img-fluid rounded border">

                    <div th:if="${tourPackage.imageUrl == null or tourPackage.imageUrl.isEmpty()}"
                         class="border rounded bg-light text-muted d-flex align-items-center justify-content-center"
                         style="height: 220px;">
                        No image available
                    </div>
                </div>

                <div class="col-md-7">
                    <h3 th:text="${tourPackage.packageName}">Sample Package</h3>

                    <p class="text-muted mb-2">
                        <strong>Location Area:</strong>
                        <span th:text="${tourPackage.locationArea}">Galle</span>
                    </p>

                    <p class="mb-2">
                        <strong>Base Price:</strong>
                        Rs. <span th:text="${tourPackage.basePrice}">45000.00</span>
                    </p>

                    <p class="mb-2">
                        <strong>Created At:</strong>
                        <span th:text="${tourPackage.createdAt}">2026-05-11</span>
                    </p>

                    <hr>

                    <h5>Description</h5>
                    <p th:text="${tourPackage.description}">
                        Package description will appear here.
                    </p>

                    <div class="d-flex gap-2 mt-4">
                        <a class="btn btn-secondary" th:href="@{/packages}">Back</a>

                        <a class="btn btn-warning"
                           th:href="@{/packages/edit/{id}(id=${tourPackage.packageId})}">
                            Edit Package
                        </a>

                        <a class="btn btn-success"
                           th:href="@{/packages/{id}/assign-destinations(id=${tourPackage.packageId})}">
                            Assign Destinations
                        </a>
                    </div>
                </div>
            </div>

        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tour Package Form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Tourism Platform</a>

        <div class="d-flex gap-2">
            <a class="btn btn-outline-light btn-sm" th:href="@{/packages}">Packages</a>
            <a class="btn btn-outline-light btn-sm" th:href="@{/destinations}">Destinations</a>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-7">

            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Tour Package Form</h4>
                </div>

                <div class="card-body">

                    <form th:object="${tourPackage}"
                          th:action="${tourPackage.packageId == 0 ? '/packages/save' : '/packages/update'}"
                          method="post">

                        <input type="hidden" th:field="*{packageId}">

                        <div class="mb-3">
                            <label class="form-label">Package Name</label>
                            <input type="text" class="form-control" th:field="*{packageName}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Location Area</label>
                            <input type="text" class="form-control" th:field="*{locationArea}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" rows="4" th:field="*{description}"></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Base Price</label>
                            <input type="number" step="0.01" class="form-control" th:field="*{basePrice}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Image URL / Path</label>
                            <input type="text" class="form-control" th:field="*{imageUrl}">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Status</label>
                            <select class="form-select" th:field="*{status}">
                                <option value="ACTIVE">ACTIVE</option>
                                <option value="INACTIVE">INACTIVE</option>
                            </select>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a class="btn btn-secondary" th:href="@{/packages}">Back</a>
                            <button type="submit" class="btn btn-success">Save Package</button>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tour Packages</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Tourism Platform</a>

        <div class="d-flex gap-2">
            <a class="btn btn-outline-light btn-sm" th:href="@{/packages}">Packages</a>
            <a class="btn btn-outline-light btn-sm" th:href="@{/destinations}">Destinations</a>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Tour Packages</h2>
        <a class="btn btn-success" th:href="@{/packages/new}">Add New Package</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">

            <table class="table table-bordered table-hover align-middle">
                <thead class="table-primary">
                <tr>
                    <th>ID</th>
                    <th>Package Name</th>
                    <th>Location Area</th>
                    <th>Base Price</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="pkg : ${packages}">
                    <td th:text="${pkg.packageId}">1</td>
                    <td th:text="${pkg.packageName}">Sample Package</td>
                    <td th:text="${pkg.locationArea}">Galle</td>
                    <td th:text="${pkg.basePrice}">45000.00</td>


                    <td>

                        <!-- OOP STATUS -->
                        <span class="badge bg-info"
                              th:text="${service.getDestinationStatus(pkg.packageId)}">
                        </span>

                        <br>

                        <!-- DATABASE STATUS -->
                        <span th:if="${pkg.status == 'ACTIVE'}"
                              class="badge bg-success">
                                ACTIVE
                        </span>

                        <span th:if="${pkg.status == 'INACTIVE'}"
                              class="badge bg-secondary">
                                INACTIVE
                        </span>

                    </td>

                    <td>

                        <!-- VIEW BUTTON -->
                        <a class="btn btn-info btn-sm"
                           th:href="@{/packages/view/{id}(id=${pkg.packageId})}">
                            View
                        </a>

                        <!-- EDIT BUTTON -->
                        <a class="btn btn-warning btn-sm"
                           th:href="@{/packages/edit/{id}(id=${pkg.packageId})}">
                            Edit
                        </a>

                        <!-- DEACTIVATE BUTTON (only if ACTIVE) -->
                        <a th:if="${pkg.status == 'ACTIVE'}"
                           class="btn btn-danger btn-sm"
                           th:href="@{/packages/delete/{id}(id=${pkg.packageId})}">
                            Deactivate
                        </a>

                        <!-- ACTIVATE BUTTON (only if INACTIVE) -->
                        <a th:if="${pkg.status == 'INACTIVE'}"
                           class="btn btn-success btn-sm"
                           th:href="@{/packages/activate/{id}(id=${pkg.packageId})}">
                            Activate
                        </a>

                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(packages)}">
                    <td colspan="6" class="text-center text-muted">
                        No tour packages found.
                    </td>
                </tr>
                </tbody>
            </table>

        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

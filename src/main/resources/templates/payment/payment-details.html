<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Payment Details</title>
    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h3 class="mb-0">Payment Details</h3>
        </div>

        <div class="card-body">

            <table class="table table-bordered">
                <tr>
                    <th>Payment ID</th>
                    <td th:text="${payment.paymentId}">1</td>
                </tr>

                <tr>
                    <th>Booking ID</th>
                    <td th:text="${payment.bookingId}">1</td>
                </tr>

                <tr>
                    <th>User ID</th>
                    <td th:text="${payment.userId}">1</td>
                </tr>

                <tr>
                    <th>Payment Method</th>
                    <td th:text="${payment.paymentMethod}">CARD</td>
                </tr>

                <tr>
                    <th>Amount</th>
                    <td th:text="${payment.amount}">50000.00</td>
                </tr>

                <tr>
                    <th>Payment Status</th>
                    <td>
                        <span class="badge"
                              th:classappend="${payment.paymentStatus == 'PAID'} ? ' bg-success' :
                                              (${payment.paymentStatus == 'PENDING'} ? ' bg-warning text-dark' :
                                              (${payment.paymentStatus == 'FAILED'} ? ' bg-danger' :
                                              (${payment.paymentStatus == 'CANCELLED'} ? ' bg-secondary' :
                                              (${payment.paymentStatus == 'REFUNDED'} ? ' bg-info text-dark' :
                                              ' bg-dark'))))"
                              th:text="${payment.paymentStatus}">
                            PAID
                        </span>
                    </td>
                </tr>

                <tr>
                    <th>Refund Status</th>
                    <td th:text="${payment.refundStatus}">NONE</td>
                </tr>

                <tr>
                    <th>Refund Amount</th>
                    <td th:text="${payment.refundAmount}">0.00</td>
                </tr>

                <tr>
                    <th>Payment Date</th>
                    <td th:text="${payment.paymentDate}">2026-05-11T10:30</td>
                </tr>
            </table>

            <a th:href="@{/payments/user/{userId}(userId=${payment.userId})}"
               class="btn btn-secondary">
                Back to My Payments
            </a>

        </div>
    </div>

</div>

</body>
</html>

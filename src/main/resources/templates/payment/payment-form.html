<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Make Payment</title>
    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h3 class="mb-0">Make Payment</h3>
        </div>

        <div class="card-body">

            <p class="text-muted">
                Please choose your payment method for this booking.
            </p>

            <form th:action="@{/payments/pay}" th:object="${payment}" method="post">

                <input type="hidden" th:field="*{bookingId}">
                <input type="hidden" th:field="*{userId}">
                <input type="hidden" th:field="*{amount}">

                <div class="mb-3">
                    <label class="form-label">Booking ID</label>
                    <input type="text" class="form-control" th:value="${payment.bookingId}" readonly>
                </div>

                <div class="mb-3">
                    <label class="form-label">User ID</label>
                    <input type="text" class="form-control" th:value="${payment.userId}" readonly>
                </div>

                <div class="mb-3">
                    <label class="form-label">Amount</label>
                    <input type="text" class="form-control" th:value="${payment.amount}" readonly>
                </div>

                <div class="mb-3">
                    <label for="paymentMethod" class="form-label">Payment Method</label>
                    <select id="paymentMethod" class="form-select" th:field="*{paymentMethod}" required>
                        <option value="">-- Select Payment Method --</option>
                        <option value="CARD">Card</option>
                        <option value="BANK_TRANSFER">Bank Transfer</option>
                    </select>
                </div>

                <div class="alert alert-info">
                    <strong>Note:</strong>
                    Card payments are marked as PAID immediately.
                    Bank transfers are marked as PENDING until admin confirms the payment.
                </div>

                <button type="submit" class="btn btn-success">
                    Pay Now
                </button>

                <a th:href="@{/payments/user/{userId}(userId=${payment.userId})}"
                   class="btn btn-secondary">
                    Back to My Payments
                </a>

            </form>

        </div>
    </div>

</div>

</body>
</html>

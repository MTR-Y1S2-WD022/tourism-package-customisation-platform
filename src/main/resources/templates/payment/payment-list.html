<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Payments</title>
    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h3 class="mb-0">My Payments</h3>
        </div>

        <div class="card-body">

            <div th:if="${#lists.isEmpty(payments)}" class="alert alert-warning">
                No payment records found.
            </div>

            <div th:if="${!#lists.isEmpty(payments)}" class="table-responsive">
                <table class="table table-bordered table-hover align-middle">
                    <thead class="table-dark">
                    <tr>
                        <th>Payment ID</th>
                        <th>Booking ID</th>
                        <th>Method</th>
                        <th>Amount</th>
                        <th>Payment Status</th>
                        <th>Refund Status</th>
                        <th>Refund Amount</th>
                        <th>Payment Date</th>
                        <th>Action</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="payment : ${payments}">
                        <td th:text="${payment.paymentId}">1</td>
                        <td th:text="${payment.bookingId}">1</td>
                        <td th:text="${payment.paymentMethod}">CARD</td>
                        <td th:text="${payment.amount}">50000.00</td>

                        <td>
                            <span class="badge"
                                  th:classappend="${payment.paymentStatus == 'PAID'} ? ' bg-success' :
                                                  (${payment.paymentStatus == 'PENDING'} ? ' bg-warning text-dark' :
                                                  (${payment.paymentStatus == 'FAILED'} ? ' bg-danger' :
                                                  (${payment.paymentStatus == 'CANCELLED'} ? ' bg-secondary' :
                                                  (${payment.paymentStatus == 'REFUNDED'} ? ' bg-info text-dark' :
                                                  ' bg-dark'))))"
                                  th:text="${payment.paymentStatus}">
                                PAID
                            </span>
                        </td>

                        <td th:text="${payment.refundStatus}">NONE</td>
                        <td th:text="${payment.refundAmount}">0.00</td>
                        <td th:text="${payment.paymentDate}">2026-05-11T10:30</td>

                        <td>
                            <a th:href="@{/payments/details/{paymentId}(paymentId=${payment.paymentId})}"
                               class="btn btn-sm btn-info">
                                View Details
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <a href="/" class="btn btn-secondary mt-3">
                Back to Home
            </a>

        </div>
    </div>

</div>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Review Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1b4332, #2d6a4f, #40916c);
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
        }

        .page-title {
            color: white;
            font-weight: 700;
        }

        .page-subtitle {
            color: #b7e4c7;
        }

        .card {
            border: none;
            border-radius: 14px;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.2);
        }

        .card-header {
            border-radius: 14px 14px 0 0 !important;
            font-weight: 600;
            font-size: 1rem;
        }

        .card-header.green-header {
            background-color: #1b4332 !important;
            color: white;
        }

        .card-header.review-header {
            background-color: #2d6a4f !important;
            color: white;
        }

        .form-label {
            color: #1b4332;
            font-weight: 500;
        }

        .form-check-input:checked {
            background-color: #40916c;
            border-color: #40916c;
        }

        .form-control:focus {
            border-color: #40916c;
            box-shadow: 0 0 0 0.2rem rgba(64, 145, 108, 0.25);
        }

        .btn-primary {
            background-color: #40916c;
            border-color: #40916c;
        }

        .btn-primary:hover {
            background-color: #2d6a4f;
            border-color: #2d6a4f;
        }

        .btn-outline-secondary {
            color: #2d6a4f;
            border-color: #2d6a4f;
        }

        .btn-outline-secondary:hover {
            background-color: #2d6a4f;
            color: white;
        }

        .btn-outline-dark {
            color: #1b4332;
            border-color: #1b4332;
        }

        .btn-outline-dark:hover {
            background-color: #1b4332;
            color: white;
        }

        .rating-option {
            background-color: #d8f3dc;
            border: 1px solid #b7e4c7;
            border-radius: 10px;
            padding: 8px 16px;
            transition: all 0.2s ease;
        }

        .rating-option:hover {
            background-color: #b7e4c7;
        }

        .badge.bg-success {
            background-color: #40916c !important;
        }
    </style>
</head>

<body>

<div class="container mt-5 mb-5">

    <div class="mb-4">
        <h1 class="page-title" th:if="${review.reviewId == 0}">✍️ Add Review</h1>
        <h1 class="page-title" th:unless="${review.reviewId == 0}">✏️ Edit Review</h1>
        <p class="page-subtitle">Share your rating and feedback about your completed tour.</p>
    </div>

    <div th:if="${errorMessage != null}" class="alert alert-danger" th:text="${errorMessage}">
        Error message
    </div>

    <div th:if="${booking != null}" class="card mb-4">
        <div class="card-header green-header">
            📋 Booking Summary
        </div>
        <div class="card-body bg-white">
            <p><strong>Booking ID:</strong> <span th:text="${booking.bookingId}">1</span></p>
            <p><strong>Package:</strong> <span th:text="${booking.packageName}">Package Name</span></p>
            <p><strong>Tour Status:</strong>
                <span class="badge bg-success" th:text="${booking.tourStatus}">COMPLETED</span>
            </p>
            <p class="mb-0"><strong>Payment Status:</strong>
                <span class="badge bg-info text-dark" th:text="${booking.paymentStatus}">PAID</span>
            </p>
        </div>
    </div>

    <div class="card">
        <div class="card-header review-header">
            ⭐ Review Details
        </div>

        <div class="card-body bg-white">
            <form th:object="${review}"
                  th:action="@{${review.reviewId == 0 ? '/reviews/save' : '/reviews/update'}}"
                  method="post">

                <input type="hidden" th:field="*{reviewId}">
                <input type="hidden" th:field="*{bookingId}">
                <input type="hidden" th:field="*{userId}">
                <input type="hidden" th:field="*{packageId}">

                <div class="mb-4">
                    <label class="form-label">Rating</label>
                    <div class="d-flex gap-3 flex-wrap">

                        <div class="form-check rating-option">
                            <input class="form-check-input" type="radio" th:field="*{rating}" value="1" id="rating1">
                            <label class="form-check-label" for="rating1">1 ⭐</label>
                        </div>

                        <div class="form-check rating-option">
                            <input class="form-check-input" type="radio" th:field="*{rating}" value="2" id="rating2">
                            <label class="form-check-label" for="rating2">2 ⭐⭐</label>
                        </div>

                        <div class="form-check rating-option">
                            <input class="form-check-input" type="radio" th:field="*{rating}" value="3" id="rating3">
                            <label class="form-check-label" for="rating3">3 ⭐⭐⭐</label>
                        </div>

                        <div class="form-check rating-option">
                            <input class="form-check-input" type="radio" th:field="*{rating}" value="4" id="rating4">
                            <label class="form-check-label" for="rating4">4 ⭐⭐⭐⭐</label>
                        </div>

                        <div class="form-check rating-option">
                            <input class="form-check-input" type="radio" th:field="*{rating}" value="5" id="rating5">
                            <label class="form-check-label" for="rating5">5 ⭐⭐⭐⭐⭐</label>
                        </div>

                    </div>
                    <small class="text-muted mt-2 d-block">Rating must be between 1 and 5.</small>
                </div>

                <div class="mb-4">
                    <label for="comment" class="form-label">Comment</label>
                    <textarea id="comment"
                              class="form-control"
                              rows="5"
                              th:field="*{comment}"
                              placeholder="Write your review here..."></textarea>
                </div>

                <div class="d-flex gap-2 flex-wrap">
                    <button type="submit" class="btn btn-primary">
                        💾 Save Review
                    </button>
                    <a href="/history/bookings" class="btn btn-outline-secondary">
                        ← Back to Booking History
                    </a>
                    <a href="/reviews" class="btn btn-outline-dark">
                        👁 View Reviews
                    </a>
                </div>

            </form>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

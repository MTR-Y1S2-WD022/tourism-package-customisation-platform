<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Review Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background-color: #f8f9fa;">

<div class="container mt-5">

    <div class="mb-4">
        <h1 class="text-primary" th:if="${review.reviewId == 0}">Add Review</h1>
        <h1 class="text-primary" th:unless="${review.reviewId == 0}">Edit Review</h1>
        <p class="text-muted">Share your rating and feedback about your completed tour.</p>
    </div>

    <div th:if="${errorMessage != null}" class="alert alert-danger" th:text="${errorMessage}">
        Error message
    </div>

    <div th:if="${booking != null}" class="card mb-4 shadow-sm">
        <div class="card-header bg-dark text-white">
            Booking Summary
        </div>

        <div class="card-body">
            <p><strong>Booking ID:</strong> <span th:text="${booking.bookingId}">1</span></p>
            <p><strong>Package:</strong> <span th:text="${booking.packageName}">Package Name</span></p>
            <p><strong>Tour Status:</strong> <span class="badge bg-success" th:text="${booking.tourStatus}">COMPLETED</span></p>
            <p><strong>Payment Status:</strong> <span class="badge bg-info text-dark" th:text="${booking.paymentStatus}">PAID</span></p>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            Review Details
        </div>

        <div class="card-body">

            <form th:object="${review}"
                  th:action="@{${review.reviewId == 0 ? '/reviews/save' : '/reviews/update'}}"
                  method="post">

                <input type="hidden" th:field="*{reviewId}">
                <input type="hidden" th:field="*{bookingId}">
                <input type="hidden" th:field="*{userId}">
                <input type="hidden" th:field="*{packageId}">

                <div class="mb-3">
                    <label class="form-label">Rating</label>

                    <div class="d-flex gap-3 flex-wrap">
                        <div class="form-check">
                            <input class="form-check-input" type="radio" th:field="*{rating}" value="1" id="rating1">
                            <label class="form-check-label" for="rating1">1 ⭐</label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input" type="radio" th:field="*{rating}" value="2" id="rating2">
                            <label class="form-check-label" for="rating2">2 ⭐⭐</label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input" type="radio" th:field="*{rating}" value="3" id="rating3">
                            <label class="form-check-label" for="rating3">3 ⭐⭐⭐</label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input" type="radio" th:field="*{rating}" value="4" id="rating4">
                            <label class="form-check-label" for="rating4">4 ⭐⭐⭐⭐</label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input" type="radio" th:field="*{rating}" value="5" id="rating5">
                            <label class="form-check-label" for="rating5">5 ⭐⭐⭐⭐⭐</label>
                        </div>
                    </div>

                    <small class="text-muted">Rating must be between 1 and 5.</small>
                </div>

                <div class="mb-3">
                    <label for="comment" class="form-label">Comment</label>
                    <textarea id="comment"
                              class="form-control"
                              rows="5"
                              th:field="*{comment}"
                              placeholder="Write your review here..."></textarea>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        Save Review
                    </button>

                    <a href="/history/bookings" class="btn btn-outline-secondary">
                        Back to Booking History
                    </a>

                    <a href="/reviews" class="btn btn-outline-dark">
                        View Reviews
                    </a>
                </div>

            </form>

        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Dashboard - Ceylon Dream Travels</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        :root {
            --ceylon-green: #102A23;
            --ceylon-gold: #F4A261;
            --ceylon-bg: #FDFBF7;
        }

        body {
            background-color: var(--ceylon-bg);
            font-family: Arial, sans-serif;
        }

        .navbar {
            background-color: var(--ceylon-green);
        }

        .dashboard-header {
            background: linear-gradient(rgba(16,42,35,0.85), rgba(16,42,35,0.85)),
            url('/images/user-dashboard.jpg');
            background-size: cover;
            background-position: center;
            color: white;
            padding: 70px 30px;
            border-radius: 20px;
        }

        .card-box {
            border: none;
            border-radius: 18px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            transition: 0.3s;
        }

        .card-box:hover {
            transform: translateY(-5px);
        }

        .btn-gold {
            background-color: var(--ceylon-gold);
            border: none;
            color: #3b2412;
            font-weight: 700;
            border-radius: 999px;
        }

        .btn-gold:hover {
            background-color: #e78f4e;
        }

        .sidebar {
            background: white;
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        .sidebar a {
            display: block;
            padding: 10px;
            color: #333;
            text-decoration: none;
            border-radius: 10px;
        }

        .sidebar a:hover {
            background-color: #f1f1f1;
        }

        .sidebar a.active {
            background-color: var(--ceylon-gold);
            color: #000;
            font-weight: bold;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/user/dashboard">
            Ceylon Dream Travels
        </a>

        <a class="btn btn-light btn-sm" href="/logout">
            Logout
        </a>
    </div>
</nav>

<div class="container mt-4">

    <!-- HEADER -->
    <div class="dashboard-header text-center mb-4">
        <h1>Welcome to Your Journey</h1>
        <p>Plan, customize and explore Sri Lanka with ease</p>
        <a href="#" class="btn btn-gold px-4 py-2">
            Start Booking
        </a>
    </div>

    <div class="row">

        <!-- SIDEBAR -->
        <div class="col-md-3">
            <div class="sidebar">
                <h5 class="fw-bold mb-3">Menu</h5>

                <a class="active" href="/user/dashboard">
                    <i class="bi bi-house"></i> Dashboard
                </a>

                <a href="/user/profile">
                    <i class="bi bi-person"></i> My Profile
                </a>

                <a href="#">
                    <i class="bi bi-card-list"></i> My Bookings
                </a>

                <a href="#">
                    <i class="bi bi-ticket-perforated"></i> Coupons
                </a>
            </div>
        </div>

        <!-- MAIN CONTENT -->
        <div class="col-md-9">

            <div class="row g-3">

                <div class="col-md-4">
                    <div class="card card-box p-3 text-center">
                        <i class="bi bi-geo-alt fs-1 text-success"></i>
                        <h5 class="mt-2">Explore Packages</h5>
                        <p class="text-muted small">Browse available tour packages</p>
                        <a href="#" class="btn btn-gold btn-sm">View</a>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card card-box p-3 text-center">
                        <i class="bi bi-calendar-check fs-1 text-success"></i>
                        <h5 class="mt-2">My Bookings</h5>
                        <p class="text-muted small">Check your trip status</p>
                        <a href="#" class="btn btn-gold btn-sm">View</a>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card card-box p-3 text-center">
                        <i class="bi bi-person-circle fs-1 text-success"></i>
                        <h5 class="mt-2">Profile</h5>
                        <p class="text-muted small">Update your details</p>
                        <a href="/user/profile" class="btn btn-gold btn-sm">Edit</a>
                    </div>
                </div>

            </div>

        </div>

    </div>
</div>

</body>
</html>

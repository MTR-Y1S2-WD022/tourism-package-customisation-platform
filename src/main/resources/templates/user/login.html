<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Login - Ceylon Dream Travels</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        :root {
            --ceylon-green: #1B4332;
            --ceylon-gold: #F4A261;
            --ceylon-sand: #FDFBF7;
        }

        body {
            background-color: var(--ceylon-sand);
            font-family: Arial, sans-serif;
        }

        .auth-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 40px 0;
        }

        .auth-card {
            background-color: #ffffff;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 22px 60px rgba(15, 23, 42, 0.18);
        }

        .image-panel {
            min-height: 580px;
            background:
                linear-gradient(rgba(16, 42, 35, 0.55), rgba(16, 42, 35, 0.70)),
                url('/images/login-travel.jpg');
            background-size: cover;
            background-position: center;
            color: #ffffff;
            display: flex;
            align-items: end;
            padding: 40px;
        }

        .quote-box {
            border-left: 4px solid var(--ceylon-gold);
            padding-left: 18px;
        }

        .form-panel {
            padding: 54px 48px;
        }

        .brand-title {
            color: var(--ceylon-green);
            font-weight: 800;
        }

        .btn-ceylon-gold {
            background-color: var(--ceylon-gold);
            border-color: var(--ceylon-gold);
            color: #3b2412;
            font-weight: 800;
            border-radius: 999px;
            padding: 12px;
        }

        .btn-ceylon-gold:hover {
            background-color: #e78f4e;
            border-color: #e78f4e;
            color: #2b1708;
        }

        .form-control-lg {
            border-radius: 14px;
        }

        a {
            color: var(--ceylon-green);
            font-weight: 600;
            text-decoration: none;
        }

        a:hover {
            color: #0f2e22;
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="container auth-wrapper">
    <div class="row auth-card w-100 mx-auto" style="max-width: 1050px;">

        <div class="col-lg-6 d-none d-lg-flex image-panel">
            <div class="quote-box">
                <h3 class="fw-bold">Welcome back.</h3>
                <p class="fs-5 mb-0">Your next great journey awaits.</p>
            </div>
        </div>

        <div class="col-lg-6 form-panel">

            <div class="mb-4">
                <a th:href="@{/}" class="small">
                    <i class="bi bi-arrow-left"></i>
                    Back to Home
                </a>
            </div>

            <h2 class="brand-title mb-2">Sign In</h2>
            <p class="text-muted mb-4">
                Welcome back to your adventure with Ceylon Dream Travels.
            </p>

            <div th:if="${message}" class="alert alert-info">
                <span th:text="${message}"></span>
            </div>

            <div th:if="${errorMessage}" class="alert alert-danger">
                <span th:text="${errorMessage}"></span>
            </div>

            <form th:action="@{/login}" method="post">

                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold">Email Address</label>
                    <input type="email"
                           class="form-control form-control-lg"
                           id="email"
                           name="email"
                           placeholder="Enter your email"
                           required>
                </div>

                <div class="mb-2">
                    <label for="password" class="form-label fw-semibold">Password</label>
                    <input type="password"
                           class="form-control form-control-lg"
                           id="password"
                           name="password"
                           placeholder="Enter your password"
                           required>
                </div>

                <div class="text-end mb-4">
                    <a href="#" class="small">Forgot Password?</a>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-ceylon-gold btn-lg">
                        Login
                    </button>
                </div>

            </form>

            <p class="text-center mt-4 mb-0">
                Don't have an account?
                <a th:href="@{/register}">Register here</a>
            </p>

        </div>

    </div>
</div>

</body>
</html>

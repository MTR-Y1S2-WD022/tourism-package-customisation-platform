<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Profile - Ceylon Dream Travels</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        :root {
            --ceylon-green: #102A23;
            --ceylon-gold: #F4A261;
            --ceylon-bg: #FDFBF7;
        }

        body {
            background-color: var(--ceylon-bg);
            font-family: Arial, sans-serif;
        }

        .profile-header {
            background: linear-gradient(rgba(16,42,35,0.85), rgba(16,42,35,0.85)),
            url('/images/profile-bg.jpg');
            background-size: cover;
            background-position: center;
            color: white;
            padding: 30px;
            border-radius: 20px;
            position: relative;
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid #F4A261;
            object-fit: cover;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .profile-card {
            border: none;
            border-radius: 18px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.06);
            background-color: #ffffff;
        }

        .info-label {
            font-size: 13px;
            color: #6c757d;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .info-value {
            font-size: 16px;
            font-weight: 600;
            color: #222;
            margin-bottom: 20px;
        }

        .btn-gold {
            background-color: var(--ceylon-gold);
            border: none;
            color: #3b2412;
            font-weight: 700;
            border-radius: 999px;
            padding: 10px 20px;
            transition: 0.3s;
        }

        .btn-gold:hover {
            background-color: #e78f4e;
            transform: translateY(-2px);
        }

        .btn-dark-custom {
            background-color: var(--ceylon-green);
            color: white;
            font-weight: 700;
            border-radius: 999px;
            padding: 10px 20px;
            transition: 0.3s;
        }

        .btn-dark-custom:hover {
            background-color: #0b1d18;
            color: white;
            transform: translateY(-2px);
        }
    </style>
</head>

<body>

<div class="container mt-4 mb-5">

    <div class="profile-header mb-4 d-flex align-items-center gap-4">
        <a th:href="@{/user/dashboard}" class="btn btn-light btn-sm rounded-pill fw-bold text-success position-absolute top-0 end-0 m-3 shadow-sm">
            <i class="bi bi-arrow-left"></i> Dashboard
        </a>

        <div class="profile-avatar d-flex align-items-center justify-content-center bg-light">
            <i class="bi bi-person-fill fs-1 text-success"></i>
        </div>

        <div>
            <h2 class="fw-bold mb-1">
                Welcome, <span th:text="${user.fullName}"></span>
            </h2>
            <p class="text-white-50 mb-0">Manage your profile details and security settings.</p>
        </div>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger shadow-sm border-0 rounded-3">
        <i class="bi bi-exclamation-circle-fill me-2"></i>
        <span th:text="${errorMessage}"></span>
    </div>
    <div th:if="${param.message}" class="alert alert-success shadow-sm border-0 rounded-3">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${param.message}"></span>
    </div>

    <div class="card profile-card p-4 mb-4">
        <h4 class="fw-bold text-dark border-bottom pb-3 mb-4">
            <i class="bi bi-person-badge text-success me-2"></i> Current Profile Information
        </h4>

        <div class="column">
            <div class="col-md-3 col-sm-6">
                <p class="info-label"><i class="bi bi-person me-1"></i> Full Name</p>
                <p class="info-value" th:text="${user.fullName}"></p>
            </div>
            <div class="col-md-3 col-sm-6">
                <p class="info-label"><i class="bi bi-envelope me-1"></i> Email Address</p>
                <p class="info-value" th:text="${user.email}"></p>
            </div>
            <div class="col-md-3 col-sm-6">
                <p class="info-label"><i class="bi bi-telephone me-1"></i> Phone Number</p>
                <p class="info-value" th:text="${user.phoneNumber}"></p>
            </div>
            <div class="col-md-3 col-sm-6">
                <p class="info-label"><i class="bi bi-geo-alt me-1"></i> Address</p>
                <p class="info-value" th:text="${user.address}"></p>
            </div>
        </div>
    </div>

    <div class="row g-4">

        <div class="col-lg-6">
            <div class="card profile-card p-4 h-100 d-flex flex-column">
                <h5 class="mb-4 fw-bold text-dark">
                    <i class="bi bi-pencil-square text-success me-2"></i> Edit Details
                </h5>

                <form th:action="@{/user/update}" method="post" th:object="${user}" enctype="multipart/form-data" class="d-flex flex-column flex-grow-1">

                    <input type="hidden" th:field="*{userId}">

                    <div class="mb-3">
                        <label class="form-label text-muted small fw-bold">Full Name</label>
                        <input type="text" class="form-control" th:field="*{fullName}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-muted small fw-bold">Phone Number</label>
                        <input type="text" class="form-control" th:field="*{phoneNumber}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-muted small fw-bold">Address</label>
                        <textarea class="form-control" rows="2" th:field="*{address}" required></textarea>
                    </div>

                    <div class="mt-auto pt-2">
                        <button type="submit" class="btn btn-gold w-100">
                            Save Changes
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div class="col-lg-6">
            <div class="card profile-card p-4 h-100 d-flex flex-column">
                <h5 class="mb-4 fw-bold text-dark">
                    <i class="bi bi-shield-lock text-success me-2"></i> Change Password
                </h5>

                <form th:action="@{/user/change-password}" method="post" class="d-flex flex-column flex-grow-1">

                    <div class="mb-4">
                        <label class="form-label text-muted small fw-bold">Current Password</label>
                        <input type="password" name="oldPassword" class="form-control" placeholder="Enter current password" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-muted small fw-bold">New Password</label>
                        <input type="password" name="newPassword" class="form-control" placeholder="Minimum 8 characters" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-muted small fw-bold">Confirm New Password</label>
                        <input type="password" name="confirmPassword" class="form-control" placeholder="Repeat new password" required>
                    </div>

                    <div class="mt-auto pt-2">
                        <button type="submit" class="btn btn-dark-custom w-100">
                            Update Security
                        </button>
                    </div>

                </form>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

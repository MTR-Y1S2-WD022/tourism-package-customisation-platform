<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Profile - Tourism Platform</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="#">Tourism Platform</a>

        <div class="d-flex">
            <a class="btn btn-outline-light btn-sm" th:href="@{/logout}">
                Logout
            </a>
        </div>
    </div>
</nav>

<div class="container mt-4 mb-5">

    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-7">

            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">My Profile</h4>
                </div>

                <div class="card-body">

                    <div class="text-center mb-3">
                        <img th:if="${user.profileImage != null and !user.profileImage.isEmpty()}"
                             th:src="${user.profileImage}"
                             alt="Profile Image"
                             width="120"
                             height="120"
                             style="object-fit: cover; border-radius: 50%; border: 2px solid #0d6efd;">

                        <img th:if="${user.profileImage == null or user.profileImage.isEmpty()}"
                             th:src="@{/images/default-user.png}"
                             alt="Default Profile Image"
                             width="120"
                             height="120"
                             style="object-fit: cover; border-radius: 50%; border: 2px solid #0d6efd;">
                    </div>

                    <div th:if="${param.message}" class="alert alert-success">
                        <span th:text="${param.message}"></span>
                    </div>

                    <div th:if="${errorMessage}" class="alert alert-danger">
                        <span th:text="${errorMessage}"></span>
                    </div>

                    <form th:action="@{/user/update}" th:object="${user}" method="post">

                        <input type="hidden" th:field="*{userId}">
                        <input type="hidden" th:field="*{status}">

                        <div class="mb-3">
                            <label for="fullName" class="form-label">Full Name</label>
                            <input type="text"
                                   class="form-control"
                                   id="fullName"
                                   th:field="*{fullName}"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email Address</label>
                            <input type="email"
                                   class="form-control"
                                   id="email"
                                   th:field="*{email}"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="text"
                                   class="form-control"
                                   id="password"
                                   th:field="*{password}"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label for="phoneNumber" class="form-label">Phone Number</label>
                            <input type="text"
                                   class="form-control"
                                   id="phoneNumber"
                                   th:field="*{phoneNumber}"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label for="address" class="form-label">Address</label>
                            <textarea class="form-control"
                                      id="address"
                                      th:field="*{address}"
                                      rows="3"></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="profileImage" class="form-label">Profile Image Path</label>
                            <input type="text"
                                   class="form-control"
                                   id="profileImage"
                                   th:field="*{profileImage}"
                                   placeholder="/images/default-user.png">
                        </div>

                        <div class="d-flex justify-content-between">
                            <a th:href="@{/user/profile}" class="btn btn-secondary">
                                Reset
                            </a>

                            <button type="submit" class="btn btn-primary">
                                Update Profile
                            </button>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Registration - Ceylon Dream Travels</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        :root {
            --ceylon-green: #1B4332;
            --ceylon-gold: #F4A261;
            --ceylon-sand: #FDFBF7;
        }

        body {
            background-color: var(--ceylon-sand);
            font-family: Arial, sans-serif;
        }

        .auth-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 40px 0;
        }

        .auth-card {
            background-color: #ffffff;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 22px 60px rgba(15, 23, 42, 0.18);
        }

        .image-panel {
            min-height: 660px;
            background:
                linear-gradient(rgba(16, 42, 35, 0.50), rgba(16, 42, 35, 0.75)),
                url('/images/register-travel.jpg');
            background-size: cover;
            background-position: center;
            color: #ffffff;
            display: flex;
            align-items: end;
            padding: 40px;
        }

        .quote-box {
            border-left: 4px solid var(--ceylon-gold);
            padding-left: 18px;
        }

        .form-panel {
            padding: 46px 46px;
        }

        .brand-title {
            color: var(--ceylon-green);
            font-weight: 800;
        }

        .btn-ceylon-gold {
            background-color: var(--ceylon-gold);
            border-color: var(--ceylon-gold);
            color: #3b2412;
            font-weight: 800;
            border-radius: 999px;
            padding: 12px;
        }

        .btn-ceylon-gold:hover {
            background-color: #e78f4e;
            border-color: #e78f4e;
            color: #2b1708;
        }

        .form-control-lg {
            border-radius: 14px;
        }

        a {
            color: var(--ceylon-green);
            font-weight: 600;
            text-decoration: none;
        }

        a:hover {
            color: #0f2e22;
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="container auth-wrapper">
    <div class="row auth-card w-100 mx-auto" style="max-width: 1120px;">

        <div class="col-lg-5 d-none d-lg-flex image-panel">
            <div class="quote-box">
                <h3 class="fw-bold">Let's start building your dream trip.</h3>
                <p class="fs-5 mb-0">Your custom Sri Lankan escape begins here.</p>
            </div>
        </div>

        <div class="col-lg-7 form-panel">

            <div class="mb-3">
                <a th:href="@{/}" class="small">
                    <i class="bi bi-arrow-left"></i>
                    Back to Home
                </a>
            </div>

            <h2 class="brand-title mb-2">Create Your Free Account</h2>
            <p class="text-muted mb-4">
                Join Ceylon Dream Travels and start customizing your tour.
            </p>

            <div th:if="${errorMessage}" class="alert alert-danger">
                <span th:text="${errorMessage}"></span>
            </div>

            <form th:action="@{/register}" th:object="${user}" method="post">

                <input type="hidden" th:field="*{status}">

                <div class="mb-3">
                    <label for="fullName" class="form-label fw-semibold">Full Name</label>
                    <input type="text"
                           class="form-control form-control-lg"
                           id="fullName"
                           th:field="*{fullName}"
                           placeholder="Enter your full name"
                           required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="email" class="form-label fw-semibold">Email Address</label>
                        <input type="email"
                               class="form-control form-control-lg"
                               id="email"
                               th:field="*{email}"
                               placeholder="Enter email"
                               required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="phoneNumber" class="form-label fw-semibold">Phone Number</label>
                        <input type="text"
                               class="form-control form-control-lg"
                               id="phoneNumber"
                               th:field="*{phoneNumber}"
                               placeholder="Enter phone number"
                               required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label fw-semibold">Password</label>
                    <input type="password"
                           class="form-control form-control-lg"
                           id="password"
                           th:field="*{password}"
                           placeholder="Minimum 8 characters"
                           required>
                </div>

                <div class="mb-3">
                    <label for="address" class="form-label fw-semibold">Address</label>
                    <textarea class="form-control"
                              id="address"
                              th:field="*{address}"
                              rows="3"
                              placeholder="Enter address"></textarea>
                </div>

                <div class="mb-4">
                    <label for="profileImage" class="form-label fw-semibold">Profile Image Path</label>
                    <input type="text"
                           class="form-control"
                           id="profileImage"
                           th:field="*{profileImage}"
                           placeholder="/images/default-user.png">
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-ceylon-gold btn-lg">
                        Start Customizing My Tour
                    </button>
                </div>

            </form>

            <p class="text-muted small text-center mt-3 mb-2">
                By registering, you agree to our Terms & Conditions.
            </p>

            <p class="text-center mb-0">
                Already have an account?
                <a th:href="@{/login}">Log in</a>
            </p>

        </div>

    </div>
</div>

</body>
</html>

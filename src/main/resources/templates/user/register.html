<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Registration - Tourism Platform</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container">
    <div class="row justify-content-center mt-5 mb-5">
        <div class="col-md-8 col-lg-6">

            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white text-center">
                    <h4 class="mb-0">User Registration</h4>
                </div>

                <div class="card-body">

                    <div th:if="${errorMessage}" class="alert alert-danger">
                        <span th:text="${errorMessage}"></span>
                    </div>

                    <form th:action="@{/register}" th:object="${user}" method="post">

                        <input type="hidden" th:field="*{status}">

                        <div class="mb-3">
                            <label for="fullName" class="form-label">Full Name</label>
                            <input type="text"
                                   class="form-control"
                                   id="fullName"
                                   th:field="*{fullName}"
                                   placeholder="Enter full name"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email Address</label>
                            <input type="email"
                                   class="form-control"
                                   id="email"
                                   th:field="*{email}"
                                   placeholder="Enter email"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password"
                                   class="form-control"
                                   id="password"
                                   th:field="*{password}"
                                   placeholder="Enter password"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label for="phoneNumber" class="form-label">Phone Number</label>
                            <input type="text"
                                   class="form-control"
                                   id="phoneNumber"
                                   th:field="*{phoneNumber}"
                                   placeholder="Enter phone number"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label for="address" class="form-label">Address</label>
                            <textarea class="form-control"
                                      id="address"
                                      th:field="*{address}"
                                      rows="3"
                                      placeholder="Enter address"></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="profileImage" class="form-label">Profile Image Path</label>
                            <input type="text"
                                   class="form-control"
                                   id="profileImage"
                                   th:field="*{profileImage}"
                                   placeholder="/images/default-user.png">
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">
                                Register
                            </button>
                        </div>

                    </form>

                </div>

                <div class="card-footer text-center">
                    Already have an account?
                    <a th:href="@{/login}">Login here</a>
                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Update User - Admin Panel</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        :root {
            --ceylon-green: #102A23;
            --ceylon-gold: #F4A261;
            --ceylon-bg: #FDFBF7;
        }

        body {
            background: var(--ceylon-bg);
        }

        .profile-card {
            background: white;
            border-radius: 18px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        .left-panel {
            background: linear-gradient(135deg, var(--ceylon-green), #1B4332);
            color: white;
            padding: 40px;
            text-align: center;
        }

        .profile-icon {
            font-size: 90px;
            margin-bottom: 15px;
        }

        .right-panel {
            padding: 30px;
        }

        .section-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .btn-ceylon {
            background: linear-gradient(135deg, var(--ceylon-gold), #e76f51);
            color: white;
            border: none;
            border-radius: 999px;
            padding: 10px 20px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-ceylon:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 15px rgba(244,162,97,0.5);
        }

        .btn-back {
            border-radius: 999px;
        }

        .form-control:focus {
            border-color: var(--ceylon-gold);
            box-shadow: 0 0 0 0.2rem rgba(244,162,97,0.25);
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark" style="background: var(--ceylon-green);">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/admin/dashboard">
            Ceylon Dream Travels Admin
        </a>

        <a class="btn btn-outline-light btn-sm" href="/admin/users">
            Back to Users
        </a>
    </div>
</nav>

<div class="container mt-5">

    <div class="profile-card row">

        <div class="col-md-4 left-panel">

            <i class="bi bi-person-circle profile-icon"></i>

            <h4 th:text="${user.fullName}">User Name</h4>

            <span class="badge bg-warning text-dark">
                ADMIN VIEW
            </span>

        </div>

        <div class="col-md-8 right-panel">

            <form th:action="@{/admin/user/update}" method="post" th:object="${user}">

                <input type="hidden" th:field="*{userId}">

                <!-- BASIC INFO -->
                <div class="section-box">
                    <h5>Basic Information</h5>

                    <div class="mb-3">
                        <label>Full Name</label>
                        <input type="text" class="form-control" th:field="*{fullName}">
                    </div>

                    <div class="mb-3">
                        <label>Email</label>
                        <input type="email" class="form-control" th:field="*{email}">
                    </div>
                </div>

                <!-- CONTACT INFO -->
                <div class="section-box">
                    <h5>Contact Details</h5>

                    <div class="mb-3">
                        <label>Phone Number</label>
                        <input type="text" class="form-control" th:field="*{phoneNumber}">
                    </div>

                    <div class="mb-3">
                        <label>Address</label>
                        <input type="text" class="form-control" th:field="*{address}">
                    </div>
                </div>

                <!-- ACTIONS -->
                <div class="d-flex justify-content-between">

                    <a href="/admin/users" class="btn btn-secondary btn-back">
                        Cancel
                    </a>

                    <button type="submit" class="btn btn-ceylon">
                        Save Changes
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
